<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2d"><meta name="description" content="A private, mobile-first business expense and reporting workspace.">
<title>Solo Reports</title>
<style>
:root{--ink:#172235;--muted:#718096;--line:#e5eaf0;--bg:#f4f6f9;--navy:#101b2d;--blue:#315fce;--pale:#edf2ff;--green:#16845b;--red:#bd4b4b;--card:#fff;--radius:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:11px;align-items:center;padding:0 9px}.logo{width:38px;height:38px;border-radius:12px;background:#456fe0;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:17px}.brand small{color:#a9b6ca}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c4d5;text-align:left;padding:12px;border-radius:10px;font-weight:600}.nav button.active,.nav button:hover{background:#23344e;color:white}.side-note{margin-top:auto;color:#9aa9bd;font-size:12px;line-height:1.55;padding:10px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.topbar h1{font-size:19px;margin:0}.top-actions{display:flex;gap:9px;align-items:center}.content{max-width:1300px;margin:auto;padding:28px 30px 60px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px}.metric-label{font-size:12px;color:var(--muted);font-weight:650}.metric{font-size:26px;font-weight:780;margin:8px 0 4px;letter-spacing:-.7px}.positive{color:var(--green)}.negative{color:var(--red)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 13px}.section-head h2{font-size:16px;margin:0}.panel h3{font-size:15px;margin:0 0 16px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}td.amount,th.amount{text-align:right}.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#eef2f7;color:#516074;font-size:11px;font-weight:700}.tag.business{background:#e8f6ef;color:#16734e}.tag.personal{background:#fff2e7;color:#9b5a22}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#526176}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3eb;border-radius:9px;padding:11px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:74px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.hidden{display:none!important}.receipt-link{color:var(--blue);text-decoration:none;font-weight:650}.modal{position:fixed;inset:0;background:#09132299;z-index:20;display:grid;place-items:center;padding:14px}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.notice{padding:12px 14px;border-radius:10px;background:#fff8e8;color:#77551b;font-size:12px;line-height:1.5;margin:14px 0}.success-note{background:#eaf7f0;color:#176344}.rule-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.report-total{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.mobile-nav{display:none}.file-button{position:relative;overflow:hidden}.file-button input{position:absolute;inset:0;opacity:0;cursor:pointer}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.subnav button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:9px}.subnav button.active{background:var(--pale);border-color:#cbd7ff;color:#284eae}
@media(max-width:900px){html,body{height:100%;min-height:100%;width:100%}body{height:100vh;height:100dvh;overflow:hidden}.shell{height:100vh;height:100dvh;min-height:0;grid-template-columns:minmax(0,1fr)}.main{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}.sidebar{display:none}.topbar{flex:0 0 62px;padding:0 16px;height:62px}.content{flex:1;min-height:0;min-width:0;width:100%;max-width:none;margin:0;overflow-x:auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 15px calc(100px + env(safe-area-inset-bottom))}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{font-size:22px}.split{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;width:100%;min-height:64px;background:#fff;border-top:1px solid var(--line);z-index:100;justify-content:space-around;align-items:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #17223512}.mobile-nav button{border:0;background:transparent;color:#66758a;font-size:10px;font-weight:700;display:grid;gap:3px;justify-items:center;padding:5px}.mobile-nav button.active{color:var(--blue)}.mobile-nav span{font-size:18px}.top-actions .desktop-only{display:none}.rule-row{grid-template-columns:1fr 1fr}.rule-row .btn{grid-column:2}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media print{.sidebar,.topbar,.mobile-nav,.no-print,.toolbar,.actions{display:none!important}.shell{display:block}.content{padding:0;max-width:none}.panel,.card{break-inside:avoid;border:0}.report-print{display:block!important}body{background:white}.cards{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">S</div><div><strong>Solo Reports</strong><small>Small business finances</small></div></div>
<nav class="nav" id="sideNav"><button data-page="dashboard" class="active">◫ &nbsp; Overview</button><button data-page="transactions">⇄ &nbsp; Transactions</button><button data-page="reports">▤ &nbsp; Reports</button><button data-page="imports">⇧ &nbsp; Import & receipts</button><button data-page="settings">⚙ &nbsp; Categories & rules</button></nav>
<div class="side-note">Private workspace<br>Data stays in this browser unless you export a backup.<br><br>Keep original receipts and source statements for your records.</div></aside>
<main class="main"><header class="topbar"><h1 id="pageTitle">Overview</h1><div class="top-actions"><span class="muted small desktop-only" id="todayLabel"></span><button class="btn primary" onclick="openTransaction()">＋ Add expense</button></div></header>
<div class="content" id="view"></div></main></div>
<nav class="mobile-nav" id="mobileNav"><button data-page="dashboard" class="active"><span>◫</span>Home</button><button data-page="transactions"><span>⇄</span>Activity</button><button data-page="reports"><span>▤</span>Reports</button><button data-page="imports"><span>⇧</span>Import</button><button data-page="settings"><span>⚙</span>Setup</button></nav>
<div id="modalRoot"></div>
<script>
const KEY='soloReports.v1';
const COA=[
{group:'Cost of Goods Sold',items:['Direct Materials & Supplies','Inventory Purchases','Direct Contractor Labor','Other Direct Costs']},
{group:'Operating Expenses',items:['Advertising & Marketing','Software & Subscriptions','Office Supplies','Office Equipment','Travel & Transportation','Business Meals','Professional Services','Utilities','Rent & Coworking','Insurance','Repairs & Maintenance','Bank & Payment Fees','Licenses & Permits','Education & Training','Other Operating Expenses']},
{group:'Other',items:['Taxes & Licenses','Interest Expense','Depreciation','Uncategorized']}
];
const PAYMENTS=['Business Checking','Business Credit Card','Cash','PayPal','Square','Debit Card','Personal Funds','Other'];
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=()=>new Date().toISOString().slice(0,10);
let data=load(),page='dashboard',txFilter='all',reportStart=new Date(new Date().getFullYear(),0,1).toISOString().slice(0,10),reportEnd=iso(),reportType='pnl';
function blank(){return {transactions:[],rules:[{payee:'AWS',category:'Software & Subscriptions'},{payee:'Amazon Web Services',category:'Software & Subscriptions'},{payee:'Google Workspace',category:'Software & Subscriptions'},{payee:'Adobe',category:'Software & Subscriptions'},{payee:'Verizon',category:'Utilities'}],businessName:'My Business',currency:'USD'}}
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Storage is full. Export a backup and remove large receipt files before continuing.');return false}}
function allCats(){return COA.flatMap(g=>g.items)}
function sum(rows){return rows.reduce((s,t)=>s+Number(t.amount||0),0)}
function periodRows(){return data.transactions.filter(t=>t.date>=reportStart&&t.date<=reportEnd&&t.scope==='Business')}
function categoryOptions(selected){return COA.map(g=>'<optgroup label="'+esc(g.group)+'">'+g.items.map(c=>'<option '+(c===selected?'selected':'')+'>'+esc(c)+'</option>').join('')+'</optgroup>').join('')}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=({dashboard:'Overview',transactions:'Transactions',reports:'Reports',imports:'Import & receipts',settings:'Categories & rules'})[p];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString(undefined,{dateStyle:'medium'});
function render(){const v=document.getElementById('view');({dashboard:dashboard,transactions:transactionsPage,reports:reportsPage,imports:importsPage,settings:settingsPage}[page]||dashboard)(v)}
function dashboard(v){const biz=data.transactions.filter(t=>t.scope==='Business'),inc=biz.filter(t=>t.kind==='income'),exp=biz.filter(t=>t.kind==='expense'),month=new Date().toISOString().slice(0,7),m=biz.filter(t=>t.date.startsWith(month)),revenue=sum(inc),expenses=sum(exp);
v.innerHTML='<div class="section-head"><div><h2>'+esc(data.businessName)+'</h2><div class="muted small">Your financial snapshot · '+new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</div></div><div class="toolbar no-print"><button class="btn" onclick="openTransaction(\'income\')">＋ Add income</button><button class="btn primary" onclick="openTransaction()">＋ Expense</button></div></div><div class="cards"><div class="card"><div class="metric-label">Business income · all time</div><div class="metric positive">'+money(revenue)+'</div><div class="small muted">'+inc.length+' entries</div></div><div class="card"><div class="metric-label">Business expenses · all time</div><div class="metric">'+money(expenses)+'</div><div class="small muted">'+exp.length+' entries</div></div><div class="card"><div class="metric-label">Net profit · all time</div><div class="metric '+(revenue-expenses>=0?'positive':'negative')+'">'+money(revenue-expenses)+'</div><div class="small muted">Income less expenses</div></div><div class="card"><div class="metric-label">This month · net</div><div class="metric">'+money(sum(m.filter(t=>t.kind==='income'))-sum(m.filter(t=>t.kind==='expense')))+'</div><div class="small muted">'+m.length+' transactions</div></div></div><div class="split"><section class="panel"><h3>Recent activity</h3>'+txTable(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7),false)+'</section><section class="panel"><h3>Expenses by category</h3>'+categorySummary(exp)+'</section></div><div class="notice">This is a bookkeeping organizer, not tax advice. Tax deductibility depends on facts and applicable rules. Review classifications with your CPA before filing.</div>'}
function txTable(rows,actions=true){if(!rows.length)return '<div class="empty">No transactions yet. Add an expense or import a statement to get started.</div>';return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Payee / description</th><th>Category</th><th>Type</th><th class="amount">Amount</th>'+(actions?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(t=>'<tr><td>'+esc(t.date)+'</td><td><strong>'+esc(t.payee)+'</strong><div class="small muted">'+esc(t.description||'')+'</div>'+(t.receipt?'<div><a class="receipt-link" href="'+t.receipt+'" target="_blank">Receipt ↗</a></div>':'')+'</td><td>'+esc(t.category)+'</td><td><span class="tag '+(t.scope==='Business'?'business':'personal')+'">'+(t.kind==='income'?'Income':t.scope)+'</span></td><td class="amount '+(t.kind==='income'?'positive':'')+'">'+(t.kind==='expense'?'− ':'+')+money(t.amount)+'</td>'+(actions?'<td><div class="toolbar" style="flex-wrap:nowrap"><button class="btn" onclick="editTransaction(\''+t.id+'\')">Edit</button><button class="btn danger" onclick="deleteTransaction(\''+t.id+'\')">Delete</button></div></td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function categorySummary(rows){const m={};rows.filter(t=>t.kind==='expense').forEach(t=>m[t.category]=(m[t.category]||0)+Number(t.amount));const entries=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!entries.length)return '<div class="empty">Business expense categories will appear here.</div>';return entries.slice(0,9).map(([k,n])=>'<div class="report-total"><span>'+esc(k)+'</span><strong>'+money(n)+'</strong></div>').join('')}
function transactionsPage(v){v.innerHTML='<div class="section-head"><h2>All transactions</h2><div class="toolbar"><button class="btn" onclick="openTransaction(\'income\')">＋ Income</button><button class="btn primary" onclick="openTransaction()">＋ Expense</button></div></div><div class="toolbar no-print" style="margin-bottom:14px"><input id="searchTx" placeholder="Search payee or description" oninput="filterTx()"><select id="scopeTx" onchange="filterTx()"><option value="all">Business + Personal</option><option>Business</option><option>Personal</option></select><select id="kindTx" onchange="filterTx()"><option value="all">Income + expenses</option><option value="expense">Expenses</option><option value="income">Income</option></select><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="panel" id="txResults">'+txTable(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)))+'</div>'}
function filterTx(){const q=(document.getElementById('searchTx').value||'').toLowerCase(),s=document.getElementById('scopeTx').value,k=document.getElementById('kindTx').value;let rows=data.transactions.filter(t=>(s==='all'||t.scope===s)&&(k==='all'||t.kind===k)&&[t.payee,t.description,t.category].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('txResults').innerHTML=txTable(rows)}
function reportsPage(v){const rows=periodRows(),income=sum(rows.filter(t=>t.kind==='income')),expense=sum(rows.filter(t=>t.kind==='expense')),groups={};rows.filter(t=>t.kind==='expense').forEach(t=>groups[t.category]=(groups[t.category]||0)+Number(t.amount));const payment={};rows.filter(t=>t.kind==='expense').forEach(t=>payment[t.payment]=(payment[t.payment]||0)+Number(t.amount));const entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]);v.innerHTML='<div class="section-head"><div><h2>Financial reports</h2><div class="muted small">Business transactions only · select a date range</div></div><div class="toolbar no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="exportCSV()">Export CSV</button></div></div><div class="panel no-print"><div class="toolbar"><label class="small">From <input type="date" id="rStart" value="'+reportStart+'"></label><label class="small">To <input type="date" id="rEnd" value="'+reportEnd+'"></label><button class="btn primary" onclick="applyReport()">Update report</button><select id="rType" onchange="reportType=this.value"><option value="pnl">Profit & Loss</option><option value="tax">Tax category summary</option><option value="payment">Payment method summary</option></select></div></div><div class="report-print"><div class="section-head"><div><h2>'+esc(data.businessName)+' · '+(reportType==='tax'?'Tax category summary':reportType==='payment'?'Payment method summary':'Profit & Loss')+'</h2><div class="muted small">'+reportStart+' through '+reportEnd+'</div></div></div><div class="cards"><div class="card"><div class="metric-label">Total income</div><div class="metric positive">'+money(income)+'</div></div><div class="card"><div class="metric-label">Total expenses</div><div class="metric">'+money(expense)+'</div></div><div class="card"><div class="metric-label">Net profit</div><div class="metric '+(income-expense>=0?'positive':'negative')+'">'+money(income-expense)+'</div></div><div class="card"><div class="metric-label">Transactions</div><div class="metric">'+rows.length+'</div></div></div><div class="split"><section class="panel"><h3>'+(reportType==='payment'?'Expenses by payment method':'Expenses by category')+'</h3>'+Object.entries(reportType==='payment'?payment:groups).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<div class="report-total"><span>'+esc(k)+'</span><strong>'+money(n)+'</strong></div>').join('')+'<div class="report-total"><strong>Total expenses</strong><strong>'+money(expense)+'</strong></div></section><section class="panel"><h3>Income & expense detail</h3><div class="report-total"><span>Gross business income</span><strong>'+money(income)+'</strong></div><div class="report-total"><span>Less: categorized expenses</span><strong>'+money(expense)+'</strong></div><div class="report-total"><strong>Net profit / (loss)</strong><strong>'+money(income-expense)+'</strong></div><p class="small muted">Amounts reflect records marked Business in this app. This summary does not determine tax deductibility or replace formal tax accounting.</p></section></div><div class="panel" style="margin-top:15px"><h3>Transactions included</h3>'+txTable(rows,false)+'</div></div><div class="notice">Tax summary is a CPA handoff aid, not a determination that an expense is deductible. Meals, vehicle costs, equipment, inventory, contractor payments, depreciation and mixed-use expenses may require special treatment. Preserve source records and have your tax professional review them.</div>'}
function applyReport(){reportStart=document.getElementById('rStart').value;reportEnd=document.getElementById('rEnd').value;reportType=document.getElementById('rType').value;if(!reportStart||!reportEnd||reportStart>reportEnd){alert('Choose a valid date range.');return}render()}
function importsPage(v){v.innerHTML='<div class="section-head"><div><h2>Bring your records together</h2><div class="muted small">Import statement files or attach receipt images to expenses</div></div></div><div class="split"><section class="panel"><h3>Import bank, card, PayPal or Square CSV</h3><p class="muted small">Upload a CSV export from your financial provider. Map the columns before importing. Duplicate rows are not automatically merged; review your records after import.</p><div class="field"><label>CSV statement file</label><input type="file" id="csvFile" accept=".csv,text/csv"></div><div class="actions"><button class="btn primary" onclick="readCSV()">Review CSV import</button><button class="btn" onclick="downloadTemplate()">Download CSV template</button></div><div id="csvPreview"></div></section><section class="panel"><h3>Receipt capture / OCR</h3><p class="muted small">Use your phone camera to photograph a receipt. OCR can suggest vendor, date and total; verify every field before saving.</p><div class="field"><label>Take a photo or choose a receipt</label><input id="ocrFile" type="file" accept="image/*,application/pdf" capture="environment" onchange="ocrReceipt(event)"></div><div id="ocrStatus" class="small muted" style="margin-top:12px">OCR uses Tesseract.js from a public CDN and requires an internet connection. PDF text extraction is not included.</div></section></div><div class="panel" style="margin-top:15px"><h3>Data backup & restore</h3><p class="muted small">Export a full JSON backup to preserve transactions, rules and receipt attachments. Store backups securely.</p><div class="actions"><button class="btn" onclick="backupJSON()">Export full backup</button><label class="btn file-button">Restore backup<input type="file" accept=".json,application/json" onchange="restoreJSON(event)"></label></div></div><div class="notice">Direct bank connections are not enabled in this version. Secure bank/POS aggregation requires a backend, provider authorization flow (for example Plaid or direct provider APIs), encrypted token storage, and a privacy/security review. Never enter bank passwords or API secrets into this static site.</div>'}
function settingsPage(v){v.innerHTML='<div class="section-head"><div><h2>Business setup</h2><div class="muted small">Set your business name and manage automatic payee rules</div></div></div><div class="panel"><h3>Business profile</h3><div class="field" style="max-width:430px"><label>Business / report name</label><input id="businessName" value="'+esc(data.businessName)+'"></div><div class="actions"><button class="btn primary" onclick="saveBusiness()">Save profile</button></div></div><div class="panel" style="margin-top:15px"><h3>Chart of Accounts</h3><p class="muted small">Starter categories grouped for bookkeeping. Customize classifications with your CPA; these labels are not an IRS-approved chart of accounts.</p>'+COA.map(g=>'<div style="margin:16px 0"><strong>'+esc(g.group)+'</strong><div class="toolbar" style="margin-top:8px">'+g.items.map(c=>'<span class="tag">'+esc(c)+'</span>').join(' ')+'</div></div>').join('')+'</div><div class="panel" style="margin-top:15px"><h3>Automatic categorization rules</h3><p class="muted small">Payee matching is case-insensitive and checks whether the transaction vendor contains the rule text. Earlier matching rules take precedence.</p><div class="form-grid"><div class="field"><label>Payee contains</label><input id="rulePayee" placeholder="e.g. AWS"></div><div class="field"><label>Assign category</label><select id="ruleCategory">'+categoryOptions('Software & Subscriptions')+'</select></div></div><div class="actions"><button class="btn primary" onclick="addRule()">＋ Add rule</button></div><div style="margin-top:12px">'+data.rules.map((r,i)=>'<div class="rule-row"><strong>'+esc(r.payee)+'</strong><span class="muted small">'+esc(r.category)+'</span><span></span><button class="btn danger" onclick="removeRule('+i+')">Remove</button></div>').join('')+'</div></div><div class="panel" style="margin-top:15px"><h3>Privacy & storage</h3><p class="small muted">This version stores records in this browser&#39;s local storage. It does not sync across devices, provide multi-user access, or upload records to a server. Clearing browser data can erase your records; export backups regularly. Receipt files are stored with the transaction and may use substantial browser storage.</p><button class="btn danger" onclick="clearAll()">Delete all local data</button></div>'}
function saveBusiness(){data.businessName=document.getElementById('businessName').value.trim()||'My Business';save();render()}
function addRule(){const payee=document.getElementById('rulePayee').value.trim(),category=document.getElementById('ruleCategory').value;if(!payee)return alert('Enter a payee match.');data.rules.unshift({payee,category});save();render()}
function removeRule(i){if(confirm('Remove this rule?')){data.rules.splice(i,1);save();render()}}
function autoCategory(payee){const r=data.rules.find(r=>payee.toLowerCase().includes(r.payee.toLowerCase()));return r?r.category:'Uncategorized'}
function openTransaction(kind='expense',id=null){const t=id?data.transactions.find(x=>x.id===id):null;const type=t?.kind||kind;document.getElementById('modalRoot').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><div class="modal-head"><h2>'+(t?'Edit':'Add')+' '+(type==='income'?'income':'expense')+'</h2><button class="btn" onclick="closeModal()">✕</button></div><form id="txForm" onsubmit="saveTransaction(event,\''+(id||'')+'\')"><div class="form-grid"><div class="field"><label>Date *</label><input type="date" name="date" required value="'+esc(t?.date||iso())+'"></div><div class="field"><label>Vendor / Payee *</label><input name="payee" required value="'+esc(t?.payee||'')+'" placeholder="Merchant or customer"></div><div class="field"><label>Amount (including tax) *</label><input type="number" name="amount" min="0.01" step="0.01" required value="'+esc(t?.amount||'')+'" placeholder="0.00"></div><div class="field"><label>Payment method</label><select name="payment">'+PAYMENTS.map(p=>'<option '+(p===(t?.payment||'Business Checking')?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Category / Account *</label><select name="category" required>'+categoryOptions(t?.category||'Uncategorized')+'</select></div><div class="field"><label>Record type</label><select name="kind"><option value="expense" '+(type==='expense'?'selected':'')+'>Expense</option><option value="income" '+(type==='income'?'selected':'')+'>Income</option></select></div><div class="field"><label>Business or Personal</label><select name="scope"><option '+((t?.scope||'Business')==='Business'?'selected':'')+'>Business</option><option '+(t?.scope==='Personal'?'selected':'')+'>Personal</option></select></div><div class="field"><label>Receipt proof '+(type==='expense'?'(recommended)':'')+'</label><input type="file" name="receiptFile" accept="image/*,application/pdf"></div><div class="field full"><label>Business purpose / description *</label><textarea name="description" required placeholder="Explain the business reason; for meals include attendees and business context">'+esc(t?.description||'')+'</textarea></div><div class="field full"><label>Receipt file / proof link</label><input name="receiptUrl" value="'+esc(t?.receiptUrl||'')+'" placeholder="Optional URL (or attach a file above)"></div></div><div class="notice">Keep the original receipt or supporting document. A description should explain the ordinary and necessary business purpose; meals should include who attended and the business discussed.</div><div class="actions"><button class="btn primary" type="submit">Save transaction</button><button class="btn" type="button" onclick="closeModal()">Cancel</button>'+(t?'<button class="btn danger" type="button" onclick="deleteTransaction(\''+t.id+'\')">Delete</button>':'')+'</div></form></div></div>'}
function editTransaction(id){openTransaction('expense',id)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveTransaction(e,id){e.preventDefault();const f=e.target,fd=new FormData(f),file=f.elements.receiptFile.files[0];const existing=id?data.transactions.find(t=>t.id===id):null;const commit=receipt=>{const obj={id:id||crypto.randomUUID(),date:fd.get('date'),payee:fd.get('payee').trim(),amount:Number(fd.get('amount')),payment:fd.get('payment'),category:fd.get('category'),description:fd.get('description').trim(),scope:fd.get('scope'),kind:fd.get('kind'),receipt:receipt||existing?.receipt||'',receiptUrl:fd.get('receiptUrl').trim()};if(!obj.payee||!obj.description||!obj.date||!Number.isFinite(obj.amount)||obj.amount<=0)return alert('Complete all required fields and enter a valid amount.');if(existing)Object.assign(existing,obj);else data.transactions.push(obj);if(save()){closeModal();render()}};if(file){if(file.size>3*1024*1024)return alert('Please use a receipt file under 3 MB to protect browser storage.');const reader=new FileReader();reader.onload=()=>commit(reader.result);reader.readAsDataURL(file)}else commit(existing?.receipt||'')}
function deleteTransaction(id){if(confirm('Permanently delete this transaction?')){data.transactions=data.transactions.filter(t=>t.id!==id);save();closeModal();render()}}
function exportCSV(){const rows=data.transactions,cols=['date','payee','amount','payment','category','description','scope','kind','receiptUrl'];const csv=[cols.join(','),...rows.map(t=>cols.map(k=>'"'+String(t[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download('solo-reports-transactions.csv',csv,'text/csv')}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupJSON(){download('solo-reports-backup-'+iso()+'.json',JSON.stringify(data,null,2),'application/json')}
function restoreJSON(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.transactions)||!Array.isArray(d.rules))throw Error('Invalid backup');if(!confirm('Replace current local data with this backup?'))return;data={...blank(),...d};save();render();alert('Backup restored.')}catch(err){alert('Could not restore: '+err.message)}};r.readAsText(file)}
function clearAll(){if(confirm('Delete ALL Solo Reports data from this browser? Export a backup first.')){localStorage.removeItem(KEY);data=blank();render()}}
function downloadTemplate(){download('solo-reports-import-template.csv','Date,Vendor,Amount,Payment Method,Category,Description,Type,Business or Personal\n2026-01-15,Example Vendor,25.00,Business Checking,Software & Subscriptions,Monthly business software subscription,expense,Business\n','text/csv')}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&q&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
let pendingCSV=[];
function readCSV(){const file=document.getElementById('csvFile').files[0];if(!file)return alert('Choose a CSV file first.');const r=new FileReader();r.onload=()=>{pendingCSV=parseCSV(r.result);if(pendingCSV.length<2)return alert('No data rows found.');const heads=pendingCSV[0].map(h=>h.trim());const guess=(terms)=>heads.findIndex(h=>terms.some(t=>h.toLowerCase().includes(t)));const fields=[['Date',guess(['date'])],['Vendor',guess(['description','payee','merchant','vendor','name'])],['Amount',guess(['amount','total'])],['Payment',guess(['payment','account','card'])],['Category',guess(['category'])]];document.getElementById('csvPreview').innerHTML='<div class="notice">Map the columns from your CSV. Negative amounts are imported as expenses; positive amounts default to income unless you choose otherwise below.</div><div class="form-grid">'+fields.map(([n,g],i)=>'<div class="field"><label>'+n+'</label><select id="map'+i+'">'+(i===4?'<option value="-1">Auto / Uncategorized</option>':'')+heads.map((h,j)=>'<option value="'+j+'" '+(g===j?'selected':'')+'>'+esc(h)+'</option>').join('')+'</select></div>').join('')+'<div class="field"><label>Default transaction scope</label><select id="csvScope"><option>Business</option><option>Personal</option></select></div><div class="field"><label>Default payment method</label><select id="csvPayment">'+PAYMENTS.map(p=>'<option>'+p+'</option>').join('')+'</select></div></div><div class="small muted" style="margin-top:10px">'+(pendingCSV.length-1)+' rows ready for review. First 5 rows: '+pendingCSV.slice(1,6).map(r=>esc(r.join(' · '))).join('<br>')+'</div><div class="actions"><button class="btn primary" onclick="importCSV()">Import '+(pendingCSV.length-1)+' rows</button></div>'};r.readAsText(file)}
function importCSV(){const idx=[0,1,2,3,4].map(i=>Number(document.getElementById('map'+i).value));const scope=document.getElementById('csvScope').value,pay=document.getElementById('csvPayment').value;let added=0,skipped=0;pendingCSV.slice(1).forEach(row=>{const date=normalizeDate(row[idx[0]]),payee=(row[idx[1]]||'').trim(),raw=String(row[idx[2]]||'').replace(/[$,()]/g,'').trim(),n=Number(raw),cat=idx[4]===-1?'':row[idx[4]];if(!date||!payee||!Number.isFinite(n)||n===0){skipped++;return}const negative=String(row[idx[2]]).includes('(')||n<0,amount=Math.abs(n),category=allCats().includes(cat)?cat:autoCategory(payee);data.transactions.push({id:crypto.randomUUID(),date,payee,amount,payment:idx[3]>=0?(row[idx[3]]||pay):pay,category,description:'Imported statement transaction — add business purpose details before tax reporting.',scope,kind:negative?'expense':'income',receipt:'',receiptUrl:''});added++});save();pendingCSV=[];render();alert('Imported '+added+' rows. Skipped '+skipped+' invalid rows. Review imported entries and complete required business-purpose descriptions.')}
function normalizeDate(v){if(!v)return '';let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)}
async function ocrReceipt(e){const file=e.target.files[0];if(!file)return;const status=document.getElementById('ocrStatus');if(file.type==='application/pdf'){status.textContent='PDF attached files can be added to a transaction, but OCR of PDF documents is not supported yet.';return}status.textContent='Loading OCR engine…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const result=await Tesseract.recognize(file,'eng');const text=result.data.text;const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);const totalCandidates=text.match(/(?:total|amount due|balance due|grand total)[^\d$]{0,12}\$?\s?\d+[,.]?\d{0,2}|\$\s?\d+[,.]\d{2}/ig)||[];const date=(text.match(/\b(?:\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|20\d{2}-\d{2}-\d{2})\b/)||[])[0]||'';let amount='';for(const c of totalCandidates){const m=c.match(/\d+[,.]?\d{0,2}/g);if(m?.length)amount=m[m.length-1].replace(',','.')}const fileData=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});status.innerHTML='<div class="success-note notice">OCR complete. Check these suggestions; OCR can misread totals and dates.</div><div class="small">Vendor suggestion: <strong>'+esc(lines[0]||'')+'</strong><br>Date text: <strong>'+esc(date)+'</strong><br>Total suggestion: <strong>'+esc(amount)+'</strong></div><div class="actions"><button class="btn primary" onclick="openTransaction()">Create expense and attach receipt</button></div>';window.pendingReceipt=fileData;window.ocrSuggestions={payee:lines[0]||'',date:normalizeDate(date),amount:amount.replace(',','.')};}catch(err){status.textContent='OCR could not run. Check your connection and try again, or attach the receipt manually.'}}
render();
</script></body></html>
